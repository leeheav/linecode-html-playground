# This workflow produces a candidate release. Production publishing requires
# confirmation in the server workbench.
name: Workbench build
run-name: workbench-${{ inputs.workbench_build_id || github.sha }}
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      workbench_build_id:
        description: Workbench correlation ID; leave empty for a manual candidate
        required: false
        type: string
      allow_audit_risk:
        description: Explicitly accept known high dependency vulnerabilities for this manual candidate only
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: workbench-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ID: de60514f-a192-41de-be55-f167c6a51d7c
      BUILD_ID: ${{ inputs.workbench_build_id }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Audit production dependencies
        env:
          ALLOW_AUDIT_RISK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_audit_risk }}
        run: |
          set +e
          npm audit --json --omit=dev --audit-level=high --registry=https://registry.npmjs.org/ > audit-report.json
          audit_status=$?
          set -e
          python3 - "$audit_status" <<'PY'
          import json, os, pathlib, sys
          try:
              report = json.loads(pathlib.Path('audit-report.json').read_text())
              if report.get('error'):
                  raise ValueError(str(report['error']))
              counts = report['metadata']['vulnerabilities']
              high = int(counts['high']) + int(counts['critical'])
          except (KeyError, ValueError, TypeError, json.JSONDecodeError) as error:
              sys.exit(f'Audit service failed or returned invalid data: {error}')
          status = int(sys.argv[1])
          if status not in (0, 1):
              sys.exit(f'Audit process failed with exit code {status}.')
          print(f'Production dependency audit: {high} high/critical vulnerabilities')
          if high:
              if status != 1:
                  sys.exit('Audit report and process status disagree.')
              if os.environ.get('ALLOW_AUDIT_RISK', '').lower() == 'true':
                  print('::warning::Production dependency vulnerabilities explicitly accepted for this manual candidate.')
              else:
                  sys.exit('High/critical vulnerabilities block candidate publishing.')
          elif status != 0:
              sys.exit(f'Audit process failed with exit code {status}.')
          PY
      - name: Build and push fixed Linux image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          docker buildx build --platform linux/amd64 --push --provenance=false --metadata-file image-metadata.json --tag "$image:$GITHUB_SHA" .
          export IMAGE="$image"
          python3 - <<'PY'
          import json, os, pathlib, re
          digest = json.loads(pathlib.Path('image-metadata.json').read_text())['containerimage.digest']
          assert re.fullmatch(r'sha256:[a-f0-9]{64}', digest)
          manifest = dict(application_id=os.environ['APP_ID'], kind='container', commit_sha=os.environ['GITHUB_SHA'], build_id=os.environ.get('BUILD_ID', ''), image=os.environ['IMAGE']+'@'+digest)
          pathlib.Path('workbench-release.json').write_text(json.dumps(manifest))
          PY
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: workbench-release-de60514f-a192-41de-be55-f167c6a51d7c
          path: |
            workbench-release.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
